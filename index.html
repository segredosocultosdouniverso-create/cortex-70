function lerp(a,b,k){return a+(b-a)*k;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function fmt(v){if(v===undefined||v===null||isNaN(v))return"-";var a=Math.abs(v);return a>=1000?v.toFixed(0):(a>=100?v.toFixed(1):v.toFixed(2));}
function fmtT(m){var d=Math.floor(m/1440),h=Math.floor((m%1440)/60),min=m%60;return"d "+d+" "+(h<10?"0":"")+h+"h"+(min<10?"0":"")+min+"m";}
function rand(){var t=(S.rng.s+=0x6D2B79F5);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function randN(){return Math.sqrt(-2*Math.log(rand()+1e-12))*Math.cos(6.283185307*rand());}

faixa_fisio:o.fis||null,faixa_plaus:o.plaus||null,escopo:o.escopo||null,
travado:null,favorito:false,modo:"real"};

function getP(id){var v=S&&S.params[id];return v===undefined?(REG[id]?REG[id].valor:0):v;}
function setP(id,v,src){
var r=REG[id];if(!r)return;
if(typeof v==="string"){S.params[id]=v;return;}
if(isNaN(v))return;
if(src==="motor"){if(r.travado==="freeze")return;if(r.travado==="clamp")v=r.valor;}
if(r.modo!=="deus"&&r.faixa_plaus)v=clamp(v,r.faixa_plaus[0],r.faixa_plaus[1]);
S.params[id]=v;
if(src==="trava"&&r.travado==="clamp")r.valor=v;
}
function statusDe(id,v){var r=REG[id];if(!r||!r.faixa_fisio)return"";if(v<r.faixa_fisio[0]||v>r.faixa_fisio[1])return"bad";return"ok";}

  setP("sexo",c.sexo,"trava");

  var vs=(S.t%5)===0?randN():0;

  }
  
  // PAD e PAM derivados de PAS
  setP("pad",clamp(getP("pas")*0.65+vs*0.3,40,130),"motor");
  setP("pam",clamp(getP("pad")+(getP("pas")-getP("pad"))/3,50,150),"motor");

/* ---------- relógio e histórico ---------- */
function snap(){ 
  var v={}; 
  for(var i=0;i<REG_ORDER.length;i++){ 
    var id=REG_ORDER[i];
    if(id.indexOf("drug_")===0) continue;
    var x=S.params[id]; 
    if(typeof x==="number") v[id]={avg:x,min:x,max:x}; 
  } 
  return {t:S.t,v:v}; 
}

function tick(){
  if(S.morto) return;
  stepFarmacos(); 
  stepFast();
  S.t++;
  if(S.t%60===0){ 
    stepMid(); 
    S.histHora.push(snap()); 
    if(S.histHora.length>2414) S.histHora.shift(); 
  }
  if(S.t%1440===0){ 
    stepSlow(); 
    S.histDia.push(snap()); 
    if(S.histDia.length>900) S.histDia.shift(); 
  }
}

function avancarMin(n){ 
  if(!S||S.morto||EM_EXECUCAO) return;
  var fim=S.t+n;
  if(n<=20000){ 
    while(S.t<fim&&!S.morto) tick(); 
    renderTudo(); 
    return; 
  }
  EM_EXECUCAO=true;
  (function lote(){
    var k=0; 
    while(S.t<fim&&!S.morto&&k<20000){ tick(); k++; }
    renderTudo();
    if(S.t<fim&&!S.morto) setTimeout(lote,0); 
    else EM_EXECUCAO=false;
  })();
}
window.avancarMin=avancarMin;

/* ---------- farmacocinética (ADME) ---------- */
function stepFarmacos(){
  if(!S.drugs) S.drugs=[];
  S.fx={}; S.fxLento={};
  
  for(var i=0;i<DRUG_DEFS.length;i++){
    var def=DRUG_INDEX[DRUG_DEFS[i].id];
    var on=getP("drug_"+def.id+"_on");
    if(on<0.5) continue;
    
    var dose=getP("drug_"+def.id+"_dose");
    var adesao=getP("drug_"+def.id+"_adesao");
    
    // Busca ou cria instância
    var inst=null;
    for(var j=0;j<S.drugs.length;j++){
      if(S.drugs[j].id===def.id){ inst=S.drugs[j]; break; }
    }
    if(!inst){
      inst={id:def.id,A:0,C:0,proxDose:S.t};
      S.drugs.push(inst);
    }
    
    // Dose programada
    if(S.t>=inst.proxDose){
      if(rand()<adesao){
        inst.A+=dose*def.F;
      }
      inst.proxDose=S.t+def.intervaloH*60;
    }
    
    // Eliminação (meia-vida)
    var ke=Math.LN2/def.t12; // constante de eliminação por hora
    inst.A*=Math.exp(-ke/60); // por minuto
    
    // Concentração plasmática (ng/mL aproximado)
    inst.C=inst.A/(def.Vd*70)*1000; // Vd em L/kg * 70kg, converte para ng/mL
    
    setP("drug_"+def.id+"_conc",inst.C,"motor");
    
    // Efeito (Emax model)
    if(inst.C>0.01){
      var E=def.Emax*Math.pow(inst.C,def.Hill)/(Math.pow(def.EC50,def.Hill)+Math.pow(inst.C,def.Hill));
      
      // Aplica efeitos nos alvos
      for(var alvo in def.alvos){
        var peso=def.alvos[alvo];
        if(S.fx[alvo]===undefined) S.fx[alvo]=0;
        S.fx[alvo]+=E*peso;
      }
      
      // Efeitos lentos (acumulam ao longo do dia)
      if(def.id==="lecanemabe"||def.id==="donanemabe"||def.id==="aducanumabe"){
        if(S.fxLento["depuracao_ab"]===undefined) S.fxLento["depuracao_ab"]=0;
        S.fxLento["depuracao_ab"]+=E*0.1/1440;
      }
    }
  }
}

/* ---------- garantir fármacos ---------- */
function garantirFarmacos(){
  if(!S.drugs) S.drugs=[];
  for(var i=0;i<DRUG_DEFS.length;i++){
    var existe=false;
    for(var j=0;j<S.drugs.length;j++){
      if(S.drugs[j].id===DRUG_DEFS[i].id){ existe=true; break; }
    }
    if(!existe){
      S.drugs.push({id:DRUG_DEFS[i].id,A:0,C:0,proxDose:S.t+60});
    }
  }
}

var grafVar="mmse";
var grafEscala="hora";

function preencherGrafVars(){
  var sel=document.getElementById("graf-var");
  var h="";
  for(var i=0;i<REG_ORDER.length;i++){
    var id=REG_ORDER[i];

  }

}

function desenharGrafico(){
  var selEsc=document.getElementById("graf-escala");
  var selVar=document.getElementById("graf-var");
  if(selEsc) grafEscala=selEsc.value;
  if(selVar) grafVar=selVar.value;
  
  var canvas=document.getElementById("graf-canvas");
  if(!canvas) return;
  var ctx=canvas.getContext("2d");
  canvas.width=canvas.offsetWidth||800;
  canvas.height=200;
  ctx.fillStyle="#1a1f2e";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  if(!S) return;
  
  var dados=(grafEscala==="dia")?S.histDia:S.histHora;
  if(!dados||!dados.length) return;
  
  var limite=(grafEscala==="dia")?365:100;
  dados=dados.slice(-limite);
  
  var vals=[];
  for(var i=0;i<dados.length;i++){
    var v=dados[i].v&&dados[i].v[grafVar];
    if(v&&typeof v.avg==="number") vals.push({t:dados[i].t,val:v.avg});
  }
  if(vals.length<2) return;
  
  var min=Infinity,max=-Infinity;
  for(var i=0;i<vals.length;i++){
    if(vals[i].val<min) min=vals[i].val;
    if(vals[i].val>max) max=vals[i].val;
  }
  
  var r=REG[grafVar];
  if(r&&r.faixa_fisio){
    if(r.faixa_fisio[0]<min) min=r.faixa_fisio[0];
    if(r.faixa_fisio[1]>max) max=r.faixa_fisio[1];
  }
  
  var range=max-min||1;
  var dx=canvas.width/(vals.length-1);
  
  // Faixa fisiológica (fundo verde)
  if(r&&r.faixa_fisio){
    ctx.fillStyle="rgba(52,211,153,0.12)";
    var y1=canvas.height-(r.faixa_fisio[0]-min)/range*canvas.height;
    var y2=canvas.height-(r.faixa_fisio[1]-min)/range*canvas.height;
    ctx.fillRect(0,y2,canvas.width,y1-y2);
  }
  
  // Linha do valor
  ctx.strokeStyle="#4a9eff";
  ctx.lineWidth=2;
  ctx.beginPath();
  for(var i=0;i<vals.length;i++){
    var x=i*dx;
    var y=canvas.height-(vals[i].val-min)/range*canvas.height;
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();
  
  // Rótulos
  ctx.fillStyle="#9aa0a6";
  ctx.font="11px monospace";
  ctx.fillText("max: "+fmt(max),6,14);
  ctx.fillText("min: "+fmt(min),6,canvas.height-6);
  ctx.fillText(grafVar+" ("+grafEscala+")",canvas.width-150,14);
}

function importarJSON(inp){
  var f=inp.files&&inp.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d.params) throw new Error("sem params");
      S={
        schema_version:d.schema_version||SCHEMA_VERSION,
        motor_version:d.motor_version||MOTOR_VERSION,
        t:d.t||0, seed:d.seed||1,
        rng:{s:d.rng||(d.seed||1)},
        cfg:d.cfg||{}, params:d.params||{},
        log:d.log||[], events:d.events||[],
        fx:{}, fxLento:{},
        histHora:d.histHora||[], histDia:d.histDia||[],
        histMin:[], ultHora:-1, ultDia:-1,
        morto:!!d.morto, contHora:0,
        drugs:d.drugs||[], perfilExtra:d.perfilExtra||null
      };
      if(!S.drugs.length) for(var i=0;i<DRUG_DEFS.length;i++) S.drugs.push({id:DRUG_DEFS[i].id,A:0,C:0,proxDose:S.t+60});
      document.getElementById("criacao").style.display="none";
      document.getElementById("app").style.display="flex";
      addLog("fx","📂 Save importado (t="+fmtT(S.t)+")");
      renderTudo();
    }catch(e){ alert("Arquivo inválido: "+e.message); }
    inp.value="";
  };
  rd.readAsText(f);
}

/* ---------- 3. SONO ARQUITETADO (roda a cada minuto, sem sorteio) ---------- */
function sonoArquitetado(){
  var tod = S.t % 1440, m = (tod - 1380 + 1440) % 1440;   /* min desde 23:00 */
  var qual = S.cfg.sono==="ruim" ? 0.6 : (S.cfg.sono==="regular" ? 0.85 : 1);
  var fase = 0;
  if(m < 450){
    var k = Math.floor(m/90), p = m % 90;
    var remLen = Math.min(30, 8 + 7*k);
    var n3Len = Math.max(0, Math.round((40 - 10*k) * qual
      * (getP("apneia_iah")>15 ? 0.6 : 1) * (getP("cortisol_cronico")>18 ? 0.8 : 1)));
    if(p < 5) fase = 1;
    else if(p >= 90 - remLen) fase = 4;
    else if(p >= 20 && p < 20 + n3Len) fase = 3;
    else fase = 2;
    if(m > 10 && ((Math.imul(S.t, 2654435761)>>>0) % 1000) < 30*(1-qual)) fase = 0;
    S.sonoMin = (S.sonoMin||0) + (fase>0?1:0);
    if(fase===3) S.n3min = (S.n3min||0) + 1;
    if(fase===4) S.remmin = (S.remmin||0) + 1;
  }
  if(tod === 420 && S.sonoMin){
    setP("sono_n3_min", S.n3min||0, "motor");
    setP("sono_rem_min", S.remmin||0, "motor");
    setP("sono_eficiencia", 100*S.sonoMin/450, "motor");
    S.sonoMin = 0; S.n3min = 0; S.remmin = 0;
  }
  setP("sono_fase", fase, "motor");
}

/* ---------- 5. LENTO (por dia): tau em grafo + Braak + AT(N) ---------- */
var TAU_ARESTAS = [
  ["hipocampo","temporal",0.9],["temporal","parietal",0.6],["temporal","frontal",0.5],
  ["parietal","frontal",0.5],["parietal","occipital",0.45],["frontal","occipital",0.15],
  ["frontal","talamus",0.25],["temporal","talamus",0.2],["occipital","cerebelo",0.05],["talamus","tronco",0.05]
];
var AB_PESO = {frontal:1.1,parietal:1.1,temporal:1.0,occipital:0.7,hipocampo:0.6,talamus:0.4,cerebelo:0.2,tronco:0.2};
var TAU_SEMENTE = {hipocampo:1.0,temporal:0.6};

function initTau(){
  var soma = 0; for(var i=0;i<REGIOES.length;i++) soma += getP("tau_"+REGIOES[i]);
  if(soma > 0) return;
  var base = Math.max(0, (getP("ptau217") - 0.8) * 12);
  if(base <= 0) return;
  setP("tau_hipocampo", base, "motor");
  setP("tau_temporal", base*0.6, "motor");
  setP("tau_parietal", base*0.25, "motor");
  setP("tau_frontal", base*0.25, "motor");
}

function stepTauGrafo(){
  initTau();
  var carga = getP("carga_amiloide"), placa = getP("placa_amiloide");
  var acel = 1 + placa/25 + Math.max(0, getP("microglia_m1")-30)/60;
  var dep = 0.004 * (getP("limpeza_celular")/100) * (1 + 0.5*getP("bdnf")/100);
  var sem = 0.03 * Math.max(0, carga-12)/10 * getP("apoe_risco") * getP("carga_genetica");
  var d = {}, i, r;
  for(i=0;i<REGIOES.length;i++){ r = REGIOES[i]; var t = getP("tau_"+r);
    d[r] = (TAU_SEMENTE[r]||0)*sem + 0.004*acel*t*(1 - t/100) - dep*t;
    setP("abeta_"+r, clamp(placa*AB_PESO[r], 0, 100), "motor");
  }
  for(i=0;i<TAU_ARESTAS.length;i++){
    var a = TAU_ARESTAS[i][0], b = TAU_ARESTAS[i][1], w = TAU_ARESTAS[i][2];
    var ta = getP("tau_"+a), tb = getP("tau_"+b);
    if(ta > tb) d[b] += 0.03*w*acel*(ta-tb);
    else if(tb > ta) d[a] += 0.03*w*acel*(tb-ta);
  }
  var reserva = getP("reserva_cognitiva"), soma = 0;
  for(i=0;i<REGIOES.length;i++){ r = REGIOES[i];
    var tn = clamp(getP("tau_"+r) + d[r], 0, 100);
    setP("tau_"+r, tn, "motor");
    soma += tn;
  }
  setP("ptau217", clamp(Math.max(getP("ptau217"), 0.8 + 0.05*soma/REGIOES.length), 0, 100), "motor");
}

function classificarDiagnostico(){
  var hip = getP("tau_hipocampo"), tem = getP("tau_temporal"), fro = getP("tau_frontal"),
      par = getP("tau_parietal"), occ = getP("tau_occipital"), braak = 0;
  if(hip >= 5) braak = 2;
  if(tem >= 8) braak = 4;
  if(fro >= 8 || par >= 8) braak = 5;
  if(occ >= 8) braak = 6;
  if(braak !== getP("braak_estagio")){
    if(braak > getP("braak_estagio")) addEvento("🧩 Tau atinge estágio de Braak "+braak);
    setP("braak_estagio", braak, "motor");
  }
  var A = getP("carga_amiloide") >= 18 ? 1 : 0;
  var T = getP("ptau217") >= 1.5 ? 1 : 0;
  var N = (getP("nfl") > 25 || getP("rm_vol_hipocampo") < 85) ? 1 : 0;
  var antes = "A"+getP("atn_a")+"T"+getP("atn_t")+"N"+getP("atn_n");
  setP("atn_a", A, "motor");
  setP("atn_t", T, "motor");
  setP("atn_n", N, "motor");
  var depois = "A"+A+"T"+T+"N"+N;
  if(antes !== depois) addEvento("🔬 AT(N): "+(A?"A+":"A−")+(T?"T+":"T−")+(N?"N+":"N−"));
}

   +"A = sem tratamento · B = tratamento atual · C = placebo (dose 0 — cego conceitual)<br><br>"
   +"Réplicas: <select id='v11-k'><option value='6'>6</option><option value='12' selected>12</option><option value='20'>20</option></select> "
   +"Horizonte: <select id='v11-dias'><option value='180' selected>180 dias</option><option value='365'>365 dias</option></select> "
   +"<button class='prim' onclick='v11AB()'>▶ Rodar estudo</button>"
   +"<div id='v11-res' style='margin-top:8px'></div></div>"
   +"<div class='bx'><h3>2) Calibração vs literatura (slopes do histórico diário)</h3>"
   +"<button onclick='v11Cal()'>↻ Recalcular</button><div id='v11-cal' style='margin-top:6px'></div></div>";
  v11Cal();
}
window.v11Fechar=function(){ ov.style.display="none"; };
function mkRep(seed, modo){
  var c={schema_version:SCHEMA_VERSION,motor_version:MOTOR_VERSION,t:S.t,seed:seed,
    rng:{s:seed},cfg:S.cfg,params:JSON.parse(JSON.stringify(S.params)),
    log:[],events:[],fx:{},fxLento:{},histMin:[],histHora:[],histDia:[],ultHora:-1,ultDia:-1,
    morto:!!S.morto,contHora:0,drugs:JSON.parse(JSON.stringify(S.drugs)),
    perfilExtra:S.perfilExtra||null,assimilacao:0,studyPontos:[],sepsisDias:0};
  for(var i=0;i<DRUG_DEFS.length;i++){ var id=DRUG_DEFS[i].id;
    if(modo==="A") c.params["drug_"+id+"_on"]=0;
    if(modo==="C") c.params["drug_"+id+"_dose"]=0.0001;
  }
  return c;
}
var EM=false;
function rodarRep(clone,n){ var ant=S; S=clone;
  try{ for(var i=0;i<n&&!S.morto;i++) tick(); }finally{ S=ant; } }
var ENDP=["mmse","carga_amiloide","placa_amiloide","tau_hipocampo","neuronio_hipocampo",
  "neuronio_frontal","nfl","gfap","bdnf","neurogenese","vigor_global","risco_morte_ano",
  "avd_score","sangue_qualidade","idade"];
window.v11AB=function(){
  if(EM) return; EM=true;
  if(JOGANDO) togglePlay();
  var K=parseInt(document.getElementById("v11-k").value,10),
      dias=parseInt(document.getElementById("v11-dias").value,10), total=dias*1440;
  var resA=[],resB=[],resC=[],mortA=0,mortB=0,mortC=0,k=0;
  var out=document.getElementById("v11-res");
  function fim(){
    EM=false;
    var h="<table><tr><th>desfecho</th><th>A sem (med)</th><th>B com (med)</th><th>C placebo (med)</th>"
        +"<th>Δ B−A [P25–P75]</th><th>Δ C−A</th></tr>";
    for(var i=0;i<ENDP.length;i++){ var id=ENDP[i]; if(!REG[id]) continue;
      var a=mediana(resA.map(function(r){return r[id];})),
          b2=mediana(resB.map(function(r){return r[id];})),
          c2=mediana(resC.map(function(r){return r[id];}));
      var deltas=resB.map(function(r,j){ return r[id]-resA[j][id]; }).filter(function(x){return !isNaN(x);});
      var delC=resC.map(function(r,j){ return r[id]-resA[j][id]; }).filter(function(x){return !isNaN(x);});
      var cor=Math.abs(mediana(deltas))<Math.abs(mediana(delC))? " class='warn'":"";
      h+="<tr><td>"+id+"</td><td>"+f2(a)+"</td><td>"+f2(b2)+"</td><td>"+f2(c2)+"</td>"
        +"<td"+cor+">"+(mediana(deltas)>0?"+":"")+f2(mediana(deltas))+" ["+f2(pct(deltas,0.25))+"–"+f2(pct(deltas,0.75))+"]</td>"
        +"<td>"+(mediana(delC)>0?"+":"")+f2(mediana(delC))+"</td></tr>";
    }
    h+="</table><div style='margin-top:6px'>Óbitos: A="+mortA+"/"+K+" · B="+mortB+"/"+K+" · C="+mortC+"/"+K
      +" &nbsp; <button onclick='v11CSV()'>📄 Exportar réplicas (CSV)</button></div>"
      +"<div style='color:var(--tx3)'>Se Δ C−A ≈ 0 mas Δ B−A ≠ 0 → efeito farmacológico real. Se Δ B−A ≈ Δ C−A → efeito placebo/contexto.</div>";
    out.innerHTML=h;
    window._v11={resA:resA,resB:resB,resC:resC,K:K,dias:dias,mortA:mortA,mortB:mortB,mortC:mortC};
  }
  function lote(){
    var alvo=Math.min(k+2,K);
    for(;k<alvo;k++){
      var semente=(S.seed||1)*7919+k*104729;
      var A=mkRep(semente,"A"),B=mkRep(semente,"B"),C=mkRep(semente,"C");
      rodarRep(A,total); rodarRep(B,total); rodarRep(C,total);
      function snap(c){ var o={}; for(var i=0;i<ENDP.length;i++) o[ENDP[i]]=c.params[ENDP[i]];
        o._morto=c.morto?1:0; return o; }
      resA.push(snap(A)); resB.push(snap(B)); resC.push(snap(C));
      if(A.morto)mortA++; if(B.morto)mortB++; if(C.morto)mortC++;
    }
    out.textContent="Simulando... réplica "+k+"/"+K+" ("+(k*3)+" pacientes, "+dias+" d cada)";
    if(k<K) setTimeout(lote,0); else fim();
  }
  setTimeout(lote,0);
};
window.v11CSV=function(){
  var d=window._v11; if(!d) return;
  var lin=["replica;braco;"+ENDP.join(";")+";morto"];
  for(var i=0;i<d.K;i++){ ["A","B","C"].forEach(function(br,ji){
    var r=[d.resA,d.resB,d.resC][ji][i];
    lin.push((i+1)+";"+br+";"+ENDP.map(function(id){return f2(r[id]).replace(".",",");}).join(";")+";"+r._morto);
  });}
  var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+lin.join("\n")],{type:"text/csv"}));
  a.download="cortex70_estudo_ABC.csv"; a.click();
};
function slope(varId,dias){
  var h=S.histDia; if(!h||h.length<10) return NaN;
  var pts=h.slice(-Math.min(dias,h.length));
  var n=pts.length, sx=0,sy=0,sxy=0,sxx=0;
  for(var i=0;i<n;i++){ var x=pts[i].t/1440, y=pts[i].v[varId]?pts[i].v[varId].avg:NaN;
    if(isNaN(y)) return NaN; sx+=x; sy+=y; sxy+=x*y; sxx+=x*x; }
  var den=n*sxx-sx*sx; if(!den) return NaN;
  return (n*sxy-sx*sy)/den;
}
window.v11Cal=function(){
  var out=document.getElementById("v11-cal"); if(!out) return;
  if(!S.histDia||S.histDia.length<10){ out.innerHTML="Sem histórico diário suficiente — avance pelo menos 10–15 dias."; return; }
  var dias=Math.floor(S.histDia[S.histDia.length-1].t/1440 - S.histDia[0].t/1440);
  var linhas=[];
  var refMMSE={0:0,1:-2.5,2:-4.0,3:-6.0,4:-8.0}[Math.round(getP("estagio"))]||0;
  var sMMSE=slope("mmse",dias)*365;
  linhas.push(["Declínio MMSE (pts/ano)", sMMSE, refMMSE, refMMSE!==0?Math.abs(sMMSE-refMMSE)/Math.abs(refMMSE):Math.abs(sMMSE), "estágio "+Math.round(getP("estagio"))]);
  var refNFL=8+0.25*Math.max(0,getP("idade")-30);
  var vNFL=getP("nfl");
  linhas.push(["NfL atual (pg/mL)", vNFL, refNFL, Math.abs(vNFL-refNFL)/refNFL, "curva etária"]);
  var sAB=slope("carga_amiloide",dias)*365;
  var refAB=getP("carga_amiloide")>=18?(getP("apoe_risco")>0?2.0:1.0):0.15;
  linhas.push(["Acúmulo Aβ (CL/ano)", sAB, refAB, refAB>0.2?Math.abs(sAB-refAB)/refAB:Math.abs(sAB), getP("carga_amiloide")>=18?"A+":"A−"]);
  var sTAU=slope("tau_hipocampo",dias)*365;
  var refTAU=Math.min(6,Math.max(0.5,getP("braak_estagio")))*1.0;
  linhas.push(["Propagação tau hipocampal (/ano)", sTAU, refTAU, Math.abs(sTAU-refTAU)/refTAU, "Braak "+Math.round(getP("braak_estagio"))]);
  var h="<table><tr><th>parâmetro</th><th>seu simulado</th><th>referência</th><th>desvio</th><th>nota</th></tr>";
  linhas.forEach(function(L){
    var cl=L[3]<0.35?"ok":(L[3]<0.8?"warn":"bad");
    var dev=L[3]<0.35?"✓ dentro":(L[3]<0.8?"~ aproximado":"✗ fora");
    h+="<tr><td>"+L[0]+"</td><td>"+f2(L[1])+"</td><td>"+f2(L[2])+"</td><td class='"+cl+"'>"+dev+" ("+(L[3]*100).toFixed(0)+"%)</td><td>"+L[4]+"</td></tr>";
  });
  h+="</table><div style='color:var(--tx3);margin-top:4px'>Janela: "+dias+" dias. Referências didáticas (ordem de grandeza da literatura de DA). Desvio >80% sugere recalibrar constantes do motor.</div>";
  out.innerHTML=h;
};
addLog("fx","📊 Módulo validação científica carregado (N11)");
})();

   +"</table><h2>Cérebro por região (% neurônios / tau)</h2><table><tr><th>região</th><th>neurônios</th><th>sinapses</th><th>saúde</th><th>tau</th><th>Aβ</th></tr>";

      +fmt(getP("saude_"+r))+"</td><td>"+fmt(getP("tau_"+r))+"</td><td>"+fmt(getP("abeta_"+r))+"</td></tr>"; }

    h+="<tr><td>"+esc(d.nome)+"</td><td>"+fmt(getP("drug_"+d.id+"_dose"))+" "+esc(d.uniDose||"")+"</td><td>"

  h+="</table><h2>Eventos recentes</h2><ul style='margin:4px 0 0 16px'>";
  var evs=S.events.slice(-12);

  h+="</ul><div class='disc'>CÓRTEX-70 v5 — simulador didático de pesquisa. Não é dispositivo médico, não faz diagnóstico e não substitui julgamento clínico. Dados sintéticos e/ou anonimizados (LGPD).</div>";

}
